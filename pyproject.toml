[project]
name = "williamjackvondette-github-io"
version = "0.0.1"
description = "Initial website for William Von Dette GitHub"
authors = [
    {name = "WilliamJackVonDette",email = "jackvond@bu.edu"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"


dependencies = [
    "numpy (>=2.5.2,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "plotly (>=7.0.0,<8.0.0)"
]

[tool.poetry]
packages = [{include = "williamjackvondette"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
